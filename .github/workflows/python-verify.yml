name: Python verify

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to install.
        required: false
        default: "3.12"
        type: string
      working-directory:
        description: Directory containing the Python project.
        required: false
        default: .
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}

      # uv includes the dev group by default and does not fail when there is none.
      # With a committed uv.lock, --locked fails on drift, the uv analogue of npm ci.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then uv sync --all-extras --locked; else uv sync --all-extras; fi

      - name: Lint
        # uvx runs ruff without the project having to declare it.
        run: uvx ruff check .

      # pytest exits 5 when no tests are collected. Let that exit code fail this job.
      - name: Test
        # --with supplies pytest when the project does not declare it; tests still
        # run inside the project environment, so they can import the package.
        run: uv run --with pytest pytest
